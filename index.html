<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4facfe, #00f2fe);
        }

        .container{
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            width: 350px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }

        h1{
            margin-bottom: 25px;
            color: #333;
        }

        .input-group{
            margin-bottom: 20px;
            text-align: left;
        }

        label{
            font-weight: bold;
            color: #444;
        }

        input{
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        input:focus{
            border-color: #4facfe;
            outline: none;
        }

        button{
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background-color: #4facfe;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover{
            background-color: #2196f3;
        }

        .resultado{
            margin-top: 25px;
            padding: 15px;
            border-radius: 10px;
            background-color: #f5f5f5;
            display: none;
        }

        .resultado h2{
            margin-bottom: 10px;
            color: #333;
        }

        .resultado p{
            font-size: 18px;
            color: #555;
        }

        .tabela{
            margin-top: 25px;
            text-align: left;
        }

        .tabela h3{
            margin-bottom: 10px;
            color: #333;
        }

        .tabela ul{
            list-style: none;
        }

        .tabela li{
            margin-bottom: 6px;
            color: #555;
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>Calculadora de IMC</h1>

        <div class="input-group">
            <label for="peso">Peso (kg)</label>
            <input type="number" id="peso" placeholder="Ex: 70">
        </div>

        <div class="input-group">
            <label for="altura">Altura (m)</label>
            <input type="number" id="altura" step="0.01" placeholder="Ex: 1.75">
        </div>

        <button onclick="calcularIMC()">Calcular IMC</button>

        <div class="resultado" id="resultado">
            <h2>Resultado</h2>
            <p id="valorIMC"></p>
            <p id="classificacao"></p>
        </div>

        <div class="tabela">
            <h3>Tabela IMC</h3>

            <ul>
                <li>Abaixo de 18.5 → Magreza</li>
                <li>18.5 até 24.9 → Normal</li>
                <li>25 até 29.9 → Sobrepeso</li>
                <li>30 até 39.9 → Obesidade</li>
                <li>Acima de 40 → Obesidade Grave</li>
            </ul>
        </div>

    </div>

    <script>

        function calcularIMC(){

            let peso = document.getElementById("peso").value;
            let altura = document.getElementById("altura").value;

            if(peso == "" || altura == ""){

                alert("Preencha todos os campos!");
                return;
            }

            let imc = peso / (altura * altura);

            let classificacao = "";

            if(imc < 18.5){

                classificacao = "Magreza";

            } else if(imc < 25){

                classificacao = "Peso Normal";

            } else if(imc < 30){

                classificacao = "Sobrepeso";

            } else if(imc < 40){

                classificacao = "Obesidade";

            } else {

                classificacao = "Obesidade Grave";

            }

            document.getElementById("resultado").style.display = "block";

            document.getElementById("valorIMC").innerHTML =
                "Seu IMC é: " + imc.toFixed(2);

            document.getElementById("classificacao").innerHTML =
                "Classificação: " + classificacao;

        }

    </script>

</body>
</html>
